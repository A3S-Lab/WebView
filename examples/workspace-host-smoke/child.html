<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace child smoke view</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f4f0e6;
        color: #1e2923;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 56px; background: #f4f0e6; }
      article { max-width: 720px; margin: 0 auto; }
      .eyebrow { color: #50715f; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 18px 0 14px; font: 700 38px/1.1 ui-serif, Georgia, serif; }
      p { margin: 0; color: #55645c; font-size: 17px; line-height: 1.7; }
      label { display: grid; margin-top: 32px; gap: 8px; color: #50715f; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      textarea { min-height: 92px; padding: 12px; resize: vertical; border: 1px solid #c7cfc9; border-radius: 9px; background: white; color: #1e2923; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
      footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid #d6d0c3; color: #6b766f; font-size: 12px; }
    </style>
  </head>
  <body>
    <article>
      <span class="eyebrow">Typed native workspace</span>
      <h1 id="title">Mounting local application…</h1>
      <p id="content">Waiting for the host's initial document revision.</p>
      <label>State retention check<textarea id="retained">This text belongs to the mounted child WebView.</textarea></label>
      <footer id="revision">generation pending</footer>
    </article>
    <script src="/child.js"></script>
  </body>
</html>
